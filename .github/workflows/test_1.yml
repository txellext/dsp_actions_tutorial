# Test workshop GitHub Actions
name: testing

on:
  push:

jobs:
  install-cowsay:
    runs-on: ubuntu-latest
    steps:
    - name: install-cowsay
      run: pip install cowsay 
    - name: use-cowsay
      run: cowsay -c cheese -t 'hey there'

  install-cowpy:
    runs-on: ubuntu-latest
    steps:
    - name: install-cowpy
      run: pip install cowpy
    - name: use-cowpy
      run: cowpy -c tux 'hi there'
  
  call-python:
    runs-on: ubuntu-latest
    steps:
    - name: check folder
      run: ls -l
    - name: read-script
      run: python test_2.py 